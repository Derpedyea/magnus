<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="referrer" content="no-referrer" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Installs to the home screen or dock. src/theme.ts keeps theme-color on the active theme's background. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" />
		<title>Magnus Mail</title>
		<script>
			// The theme picked on this device (src/theme.ts), applied before first paint so it never flashes the default.
			{
				const mode = localStorage.getItem("theme");
				const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.dataset.theme = localStorage.getItem(dark ? "theme-dark" : "theme-light") || (dark ? "dark" : "light");
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
